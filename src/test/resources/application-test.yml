spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Disable Azure integration for tests
azure:
  client-id: test-client-id
  client-secret: test-client-secret
  tenant-id: test-tenant-id

# Test news configuration
news:
  sources:
    external:
      - name: "Test RSS Source"
        url: "https://test.example.com/feed.xml"
        type: "RSS"
  
  keywords:
    - "test"
    - "artificial intelligence"
  
  scheduling:
    fetch-interval: "0 0 */24 * * *" # Disable frequent fetching in tests
    cleanup-interval: "0 0 */24 * * *"

# Disable scheduling in tests
spring:
  task:
    scheduling:
      enabled: false

logging:
  level:
    com.cognizant.genai.newsfetcher: DEBUG
    org.springframework.web: WARN