<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognizant GenAI News Fetcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #7f8c8d;
            font-size: 1rem;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        .controls h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .btn {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn.btn-success {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
        }
        
        .btn.btn-success:hover {
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        
        .btn.btn-danger {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
        }
        
        .btn.btn-danger:hover {
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .articles-section {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        
        .articles-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .article-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            transition: transform 0.2s ease;
        }
        
        .article-card:hover {
            transform: translateX(5px);
        }
        
        .article-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .article-meta {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .article-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .tag {
            background: #3498db;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            padding: 20px;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Cognizant GenAI News Fetcher</h1>
            <p>Stay updated with the latest GenAI news from Cognizant SharePoint and external sources</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalArticles">-</div>
                <div class="stat-label">Total Articles</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="sharepointArticles">-</div>
                <div class="stat-label">SharePoint Articles</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="externalArticles">-</div>
                <div class="stat-label">External Articles</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="recentArticles">-</div>
                <div class="stat-label">Recent (7 days)</div>
            </div>
        </div>
        
        <div class="controls">
            <h2>🔧 Controls</h2>
            <div class="control-row">
                <button class="btn btn-success" onclick="fetchNews()">🔄 Fetch News Now</button>
                <button class="btn" onclick="loadAllArticles()">📰 Load All Articles</button>
                <button class="btn" onclick="loadSharePointArticles()">🔗 SharePoint Only</button>
                <button class="btn" onclick="loadExternalArticles()">🌐 External Only</button>
                <button class="btn" onclick="loadRecentArticles()">🕒 Recent Articles</button>
            </div>
            <div class="control-row">
                <input type="text" class="search-box" id="searchBox" placeholder="Search articles...">
                <button class="btn" onclick="searchArticles()">🔍 Search</button>
                <button class="btn btn-danger" onclick="clearSearch()">❌ Clear</button>
            </div>
        </div>
        
        <div class="articles-section">
            <h2>📄 Articles</h2>
            <div id="messagesContainer"></div>
            <div id="articlesContainer">
                <div class="loading">Loading articles...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        // Load statistics on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadStatistics();
            loadAllArticles();
        });
        
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_BASE}/news/statistics`);
                const stats = await response.json();
                
                document.getElementById('totalArticles').textContent = stats.totalArticles || 0;
                document.getElementById('sharepointArticles').textContent = stats.sharepointArticles || 0;
                document.getElementById('externalArticles').textContent = stats.externalArticles || 0;
                document.getElementById('recentArticles').textContent = stats.recentArticles || 0;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        async function fetchNews() {
            showMessage('Initiating news fetch...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/news/fetch`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    showMessage('News fetch initiated successfully! Articles will be updated shortly.', 'success');
                    setTimeout(() => {
                        loadStatistics();
                        loadAllArticles();
                    }, 2000);
                } else {
                    showMessage('Error: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('Error initiating fetch: ' + error.message, 'error');
            }
        }
        
        async function loadAllArticles() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/news?size=50`);
                const data = await response.json();
                displayArticles(data.content || data);
            } catch (error) {
                showMessage('Error loading articles: ' + error.message, 'error');
            }
        }
        
        async function loadSharePointArticles() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/news/sharepoint`);
                const articles = await response.json();
                displayArticles(articles);
            } catch (error) {
                showMessage('Error loading SharePoint articles: ' + error.message, 'error');
            }
        }
        
        async function loadExternalArticles() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/news/external`);
                const articles = await response.json();
                displayArticles(articles);
            } catch (error) {
                showMessage('Error loading external articles: ' + error.message, 'error');
            }
        }
        
        async function loadRecentArticles() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/news/recent?days=7`);
                const articles = await response.json();
                displayArticles(articles);
            } catch (error) {
                showMessage('Error loading recent articles: ' + error.message, 'error');
            }
        }
        
        async function searchArticles() {
            const query = document.getElementById('searchBox').value.trim();
            if (!query) {
                showMessage('Please enter a search term', 'error');
                return;
            }
            
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/news/search?query=${encodeURIComponent(query)}&size=50`);
                const articles = await response.json();
                displayArticles(articles);
            } catch (error) {
                showMessage('Error searching articles: ' + error.message, 'error');
            }
        }
        
        function clearSearch() {
            document.getElementById('searchBox').value = '';
            loadAllArticles();
        }
        
        function displayArticles(articles) {
            const container = document.getElementById('articlesContainer');
            
            if (!articles || articles.length === 0) {
                container.innerHTML = '<div class="loading">No articles found.</div>';
                return;
            }
            
            const html = articles.map(article => `
                <div class="article-card">
                    <div class="article-title">${escapeHtml(article.title || 'Untitled')}</div>
                    <div class="article-meta">
                        <strong>Source:</strong> ${escapeHtml(article.sourceName || 'Unknown')} | 
                        <strong>Published:</strong> ${formatDate(article.publishedDate)} | 
                        <strong>Relevance:</strong> ${(article.relevanceScore * 100).toFixed(1)}%
                        ${article.sentimentScore !== null ? ` | <strong>Sentiment:</strong> ${formatSentiment(article.sentimentScore)}` : ''}
                    </div>
                    ${article.description ? `<div class="article-description">${escapeHtml(article.description.substring(0, 300))}${article.description.length > 300 ? '...' : ''}</div>` : ''}
                    ${article.url ? `<div style="margin-bottom: 10px;"><a href="${escapeHtml(article.url)}" target="_blank" style="color: #3498db;">🔗 Read Full Article</a></div>` : ''}
                    ${article.tags && article.tags.length > 0 ? `
                        <div class="article-tags">
                            ${article.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            container.innerHTML = html;
        }
        
        function showLoading() {
            document.getElementById('articlesContainer').innerHTML = '<div class="loading">Loading articles...</div>';
        }
        
        function showMessage(message, type) {
            const container = document.getElementById('messagesContainer');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'loading';
            container.innerHTML = `<div class="${className}">${escapeHtml(message)}</div>`;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        function formatDate(dateString) {
            if (!dateString) return 'Unknown';
            return new Date(dateString).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function formatSentiment(score) {
            if (score > 0.3) return '😊 Positive';
            if (score < -0.3) return '😟 Negative';
            return '😐 Neutral';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Allow Enter key in search box
        document.getElementById('searchBox').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchArticles();
            }
        });
    </script>
</body>
</html>
